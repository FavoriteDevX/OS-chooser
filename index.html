<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Chooser — Find Your Ideal Operating System</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-option: #1f2937;
      --bg-option-hover: #283548;
      --border-color: #374151;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 55%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    main {
      width: 100%;
      max-width: 640px;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .start-screen {
      text-align: center;
      padding: 16px 0;
    }

    .os-icons-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .os-icons-row svg {
      width: 38px;
      height: 38px;
    }

    .start-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto 28px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 15px 32px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-option);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .option-btn:hover {
      background: var(--bg-option-hover);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .option-arrow {
      color: var(--text-muted);
      font-weight: bold;
      margin-left: 12px;
    }

    .result-screen {
      text-align: center;
    }

    .result-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #818cf8;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .winner-logo-box {
      width: 104px;
      height: 104px;
      margin: 0 auto 20px;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .winner-logo-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .winner-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .winner-desc {
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto 24px;
    }

    .variants-box {
      background: rgba(9, 13, 22, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin-bottom: 20px;
    }

    .variants-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .variant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .variant-item:last-child {
      margin-bottom: 0;
    }

    .variant-name {
      font-weight: 700;
      color: #fff;
    }

    .variant-tag {
      font-size: 12px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .runner-up {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .runner-up svg {
      width: 20px;
      height: 20px;
    }

    .btn-restart {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-restart:hover {
      background: #374151;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">OS Chooser v1.2</span>
    <h1>Which OS Should You Use?</h1>
  </header>

  <main id="app"></main>

  <footer>
    Open Source on GitHub • Deployed on Vercel
  </footer>

  <script>
    const osIcons = {
      windows: `<svg viewBox="0 0 24 24" fill="#0078D4"><path d="M3 3h8.5v8.5H3V3zm9.5 0H21v8.5h-8.5V3zM3 12.5h8.5V21H3v-8.5zm9.5 0H21V21h-8.5v-8.5z"/></svg>`,
      macos: `<svg viewBox="0 0 24 24" fill="#F9FAFB"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.96 6.33c.67-.81 1.12-1.94.99-3.08-.96.04-2.13.64-2.82 1.45-.61.7-.15 1.85-.01 2.96 1.07.08 2.17-.52 2.84-1.33z"/></svg>`,
      linux_beginner: `<svg viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="3" fill="#064E3B"/><polyline points="7 9 11 13 7 17" stroke="#34D399"/><line x1="13" y1="17" x2="18" y2="17" stroke="#34D399"/></svg>`,
      linux_hardcore: `<svg viewBox="0 0 24 24" fill="#38BDF8"><path d="M12 2L2 22h4.5l2.2-4.8h6.6L17.5 22H22L12 2zm0 6.8l2.1 4.8H9.9L12 8.8z"/></svg>`,
      chromeos: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FBBF24"/><path d="M12 2a10 10 0 0 1 8.66 5H12a5 5 0 0 0-4.33 2.5L4.34 3.73A9.96 9.96 0 0 1 12 2z" fill="#EF4444"/><path d="M3.34 7l4.33 7.5A5 5 0 0 0 12 17l-3.34 5.77A10 10 0 0 1 3.34 7z" fill="#10B981"/><circle cx="12" cy="12" r="4" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/></svg>`,
      bsd: `<svg viewBox="0 0 24 24" fill="#EF4444"><circle cx="12" cy="13" r="8"/><path d="M5 7L3 3l5 2M19 7l2-4-5 2" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/></svg>`
    };

    const osProfiles = {
      macos: {
        name: "macOS",
        icon: osIcons.macos,
        variants: [
          { name: "macOS Sequoia (MacBook Air / Pro)", tag: "Best for Portability & Devs" },
          { name: "macOS Studio (Mac Studio / Pro)", tag: "Heavy Video & 3D Rendering" }
        ],
        description: "You have the budget, appreciate sleek aluminum hardware, and want an ecosystem where everything just works seamlessly."
      },
      windows: {
        name: "Windows",
        icon: osIcons.windows,
        variants: [
          { name: "Windows 11 Home / Pro", tag: "Standard & Full Compatibility" },
          { name: "Windows 11 LTSC", tag: "Enterprise & Bloat-Free" },
          { name: "AtlasOS / Tiny11", tag: "De-bloated for Max Gaming FPS" }
        ],
        description: "The undisputed king of PC gaming and software compatibility. Everything runs here, even if it forces an update at 3 AM."
      },
      linux_beginner: {
        name: "Linux (User-Friendly)",
        icon: osIcons.linux_beginner,
        variants: [
          { name: "Linux Mint", tag: "Best for Windows Refugees" },
          { name: "Pop!_OS", tag: "Best for Gaming & NVIDIA GPUs" },
          { name: "Ubuntu / Zorin OS", tag: "Polished & Modern UI" }
        ],
        description: "You want speed, privacy, and freedom from Big Tech without needing to live inside a terminal window."
      },
      linux_hardcore: {
        name: "Linux (Power User)",
        icon: osIcons.linux_hardcore,
        variants: [
          { name: "Arch Linux", tag: "I use Arch, btw" },
          { name: "Fedora Workstation", tag: "Cutting-Edge & Stable" },
          { name: "NixOS", tag: "Reproducible & Declarative" }
        ],
        description: "You love reading wikis, customizing every pixel of your desktop, and having 100% control over your kernel."
      },
      chromeos: {
        name: "ChromeOS",
        icon: osIcons.chromeos,
        variants: [
          { name: "ChromeOS (Chromebook)", tag: "Lightweight & Battery King" },
          { name: "ChromeOS Flex", tag: "Revive Old Laptops for Free" }
        ],
        description: "Fast, secure, and cloud-first. Ideal if 95% of your daily workflow happens inside a web browser."
      },
      bsd: {
        name: "BSD / Unix",
        icon: osIcons.bsd,
        variants: [
          { name: "FreeBSD", tag: "Servers & True Unix Purists" },
          { name: "OpenBSD", tag: "Paranoid-Level Security" }
        ],
        description: "You are a true operating system connoisseur who avoids mainstream choices and values rock-solid architecture."
      }
    };
    const questions = [
      {
        category: "Budget & Hardware",
        text: "First things first: Are you rich?",
        options: [
          { text: "Yes, money is just paper. Give me shiny aluminum.", scores: { macos: 10, windows: 2 } },
          { text: "I have a decent budget, I just want good value.", scores: { macos: 3, windows: 6, linux_beginner: 5, linux_hardcore: 4, chromeos: 3 } },
          { text: "No, I'm trying to revive a laptop from 2012.", scores: { macos: -10, windows: -2, linux_beginner: 8, linux_hardcore: 7, chromeos: 9, bsd: 5 } }
        ]
      },
      {
        category: "Tech Comfort",
        text: "What is your relationship with the Terminal?",
        options: [
          { text: "I type 'sudo' in my sleep. Give me the CLI.", scores: { linux_hardcore: 10, bsd: 9, linux_beginner: 4, macos: 3 } },
          { text: "I can copy-paste commands from a tutorial if needed.", scores: { linux_beginner: 8, macos: 4, windows: 4, linux_hardcore: 3 } },
          { text: "If I see a black box with white text, I panic.", scores: { chromeos: 9, macos: 7, windows: 7, linux_hardcore: -10, bsd: -10 } }
        ]
      },
      {
        category: "Gaming",
        text: "How important is PC Gaming to you?",
        options: [
          { text: "Hardcore! Competitive games with Anti-Cheat (Valorant, CoD, Fortnite).", scores: { windows: 10, macos: -5, linux_beginner: -2, chromeos: -10, bsd: -10 } },
          { text: "Single-player & Steam games (Proton compatibility is great).", scores: { windows: 7, linux_beginner: 8, linux_hardcore: 8, macos: 1 } },
          { text: "I don't game at all.", scores: { chromeos: 8, macos: 6, linux_beginner: 6, linux_hardcore: 6, bsd: 6 } }
        ]
      },
      {
        category: "Privacy & Philosophy",
        text: "How do you feel about Big Tech collecting your data?",
        options: [
          { text: "I wear a tinfoil hat. Open-source or nothing!", scores: { linux_hardcore: 10, bsd: 10, linux_beginner: 8, windows: -5, chromeos: -8 } },
          { text: "I care a little, so I turn off telemetry when possible.", scores: { linux_beginner: 7, linux_hardcore: 5, macos: 4, windows: 4 } },
          { text: "I have nothing to hide. Just give me convenience.", scores: { chromeos: 9, macos: 7, windows: 7 } }
        ]
      },
      {
        category: "Troubleshooting",
        text: "When something breaks, how do you want to fix it?",
        options: [
          { text: "Read documentation for 4 hours and recompile the kernel.", scores: { linux_hardcore: 10, bsd: 10, macos: -5, windows: -5 } },
          { text: "Reboot the PC and hope the problem disappears.", scores: { windows: 8, macos: 6, linux_beginner: 6, chromeos: 7 } },
          { text: "Walk into a store and let a 'Genius' handle it.", scores: { macos: 10, windows: 3, linux_beginner: -5, linux_hardcore: -10 } }
        ]
      },
      {
        category: "Workflow",
        text: "What apps are mandatory for your daily work?",
        options: [
          { text: "Adobe Creative Cloud (Photoshop, Premiere) or MS Office.", scores: { macos: 9, windows: 9, linux_beginner: -5, linux_hardcore: -5, chromeos: -3 } },
          { text: "Docker, Python, Git, VS Code, and server tools.", scores: { linux_hardcore: 10, linux_beginner: 8, bsd: 8, macos: 7, windows: 4 } },
          { text: "Google Docs, YouTube, Netflix, and Spotify.", scores: { chromeos: 10, linux_beginner: 7, macos: 5, windows: 5 } }
        ]
      }
    ];

    let currentIdx = 0;
    let scores = {};
    const app = document.getElementById("app");

    function renderStart() {
      app.innerHTML = `
        <div class="start-screen">
          <div class="os-icons-row">
            ${osIcons.windows}
            ${osIcons.macos}
            ${osIcons.linux_beginner}
            ${osIcons.chromeos}
          </div>
          <p class="start-desc">
            Stop distro-hopping or overpaying for hardware. Answer <strong style="color:#fff">${questions.length} honest questions</strong> to find your ideal Operating System and exact variant.
          </p>
          <button class="btn-primary" onclick="startQuiz()">Start the Quiz →</button>
        </div>
      `;
    }

    function startQuiz() {
      currentIdx = 0;
      scores = { macos: 0, windows: 0, linux_beginner: 0, linux_hardcore: 0, chromeos: 0, bsd: 0 };
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentIdx];
      const progress = ((currentIdx + 1) / questions.length) * 100;

      const optionsHTML = q.options.map((opt, idx) => `
        <button class="option-btn" onclick="selectOption(${idx})">
          <span>${opt.text}</span>
          <span class="option-arrow">→</span>
        </button>
      `).join("");

      app.innerHTML = `
        <div>
          <div class="progress-header">
            <span>${q.category}</span>
            <span>Question ${currentIdx + 1} of ${questions.length}</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${progress}%"></div>
          </div>
          <h2 class="question-title">${q.text}</h2>
          <div class="options-list">${optionsHTML}</div>
        </div>
      `;
    }

    function selectOption(optionIdx) {
      const chosenScores = questions[currentIdx].options[optionIdx].scores;
      for (const [osKey, pts] of Object.entries(chosenScores)) {
        scores[osKey] = (scores[osKey] || 0) + pts;
      }

      if (currentIdx + 1 < questions.length) {
        currentIdx++;
        renderQuestion();
      } else {
        renderResult();
      }
    }

    function renderResult() {
      const ranked = Object.entries(scores)
        .sort((a, b) => b[1] - a[1])
        .map(([key, score]) => ({ key, score, ...osProfiles[key] }));

      const winner = ranked[0];
      const runnerUp = ranked[1];

      const variantsHTML = winner.variants.map(v => `
        <div class="variant-item">
          <span class="variant-name">${v.name}</span>
          <span class="variant-tag">${v.tag}</span>
        </div>
      `).join("");

      app.innerHTML = `
        <div class="result-screen">
          <p class="result-label">Your Ideal Match</p>
          
          <div class="winner-logo-box">
            ${winner.icon}
          </div>

          <h2 class="winner-title">${winner.name}</h2>
          <p class="winner-desc">${winner.description}</p>

          <div class="variants-box">
            <h3>Recommended Variants / Editions for You:</h3>
            ${variantsHTML}
          </div>

          <div class="runner-up">
            <span>Runner-up:</span>
            ${runnerUp.icon}
            <strong style="color:#e5e7eb">${runnerUp.name}</strong>
          </div>

          <button class="btn-restart" onclick="startQuiz()">↺ Retake Quiz</button>
        </div>
      `;
    }

    renderStart();
  </script>
</body>
</html>
